services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ejiabao
      POSTGRES_PASSWORD: ejiabao
      POSTGRES_DB: ejiabao
    ports:
      - "5432:5432"
    volumes:
      - ejiabao-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ejiabao
      MINIO_ROOT_PASSWORD: change-this-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ejiabao-minio:/data

volumes:
  ejiabao-postgres:
  ejiabao-minio:
