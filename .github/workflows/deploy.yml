# 生产部署：push 到 main 后，构建镜像推送到 GHCR，再 SSH 到服务器拉取并重启。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的镜像 tag（默认最新提交 SHA）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.DEPLOY_DIR }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
            echo "==> Ensure deploy dir and .env exist"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            if [ ! -f .env ]; then
              echo "!! .env 不存在，请先在服务器执行 scripts/setup-server.sh"
              exit 1
            fi

            echo "==> Log in to GHCR with ephemeral GITHUB_TOKEN"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Recreate api container with $IMAGE"
            echo "==> Ensure postgres is running (first deploy creates it)"
            docker compose -f docker-compose.prod.yml up -d --pull always postgres

            echo "==> Recreate api container with $IMAGE"
            DEPLOY_IMAGE="$IMAGE" docker compose -f docker-compose.prod.yml up -d --pull always api

            echo "==> Prune old images"
            docker image prune -f || true
